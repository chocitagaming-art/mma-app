name: Smoke contra produccion

# Lo único que vigilaba producción era monitor.yml (en mma-ingesta), y toca 6
# URLs de las 16 rutas de la app. Todo lo demás se comprueba contra el portátil
# o contra un build de CI: verde en local no es lo mismo que verde desplegado.
#
# Esto reutiliza la suite E2E de API que ya existe apuntándola a la web real con
# PLAYWRIGHT_BASE_URL (la config ya lo soporta y en ese modo NO levanta servidor
# propio). Comprueba que las rutas responden, que /api/health ve la base de datos
# y que los contratos de las APIs se sostienen sobre lo REALMENTE desplegado.
#
# Se ejecuta tras cada despliegue (push a main) y una vez al día, porque
# producción también se rompe sola: un cambio en Neon, una variable caducada o
# una fuente externa caída no necesitan que nadie haga push.

on:
  push:
    branches: [main]
  schedule:
    # 08:30 UTC, lejos del racimo de crons de datos de mma-ingesta.
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL a comprobar (por defecto, producción)"
        default: "https://mmastatus.app"

# Necesario para que el paso de aviso pueda abrir el Issue. `contents: read` se
# declara explicitamente porque en cuanto se nombra un permiso, los demas pasan
# a "none".
permissions:
  contents: read
  issues: write

concurrency:
  group: smoke-prod
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://mmastatus.app' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Solo chromium: esto comprueba contratos de API y códigos de respuesta,
      # no renderizado, así que instalar los tres navegadores sería tiempo tirado.
      - run: npx playwright install --with-deps chromium

      # Vercel despliega en paralelo a este job cuando el disparo es un push, así
      # que se espera a que la web sirva algo antes de empezar. Sin esto, el
      # smoke correría contra la versión ANTERIOR y daría un verde que no
      # significa nada.
      #
      # 30-jul: esperar un 200 NO bastaba. La versión anterior también responde
      # 200, así que la carrera seguía viva y el smoke corrió contra el deploy
      # viejo — con un test nuevo en rojo que en realidad ya estaba arreglado.
      # Ahora se espera al SHA: /api/health devuelve el commit desplegado
      # (VERCEL_GIT_COMMIT_SHA), y hasta que no coincida con el que disparó este
      # job, no se comprueba nada. En los disparos que no son push (cron,
      # dispatch) no hay SHA que esperar y basta con el 200 de siempre.
      - name: Esperar a que producción sirva ESTE commit
        env:
          SHA_ESPERADO: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail
          esperado="${SHA_ESPERADO:0:7}"
          # 45 intentos (~7,5 min) y no 30: ahora no se espera un 200 cualquiera
          # sino el despliegue entero, que tarda más. El job corta a los 15 min.
          for attempt in $(seq 1 45); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$PLAYWRIGHT_BASE_URL/" || echo "000")
            if [ "$code" != "200" ]; then
              echo "[$attempt] $PLAYWRIGHT_BASE_URL -> $code"
              sleep 10
              continue
            fi
            if [ -z "$esperado" ]; then
              echo "[$attempt] 200 y sin SHA que esperar (disparo $GITHUB_EVENT_NAME): adelante."
              exit 0
            fi
            desplegado=$(curl -sS --max-time 30 "$PLAYWRIGHT_BASE_URL/api/health" \
              | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || echo "?")
            echo "[$attempt] 200 · desplegado=$desplegado · esperado=$esperado"
            [ "$desplegado" = "$esperado" ] && exit 0
            sleep 10
          done
          echo "::error::Producción no sirve el commit ${esperado:-(cualquiera)} tras 5 minutos."
          exit 1

      # Un solo proyecto: los proyectos de playwright.config son combinaciones de
      # viewport y tema, y estas pruebas son de contrato de API, no de
      # renderizado. Correr los seis repetiría las mismas 10 llamadas seis veces.
      - name: Smoke de las APIs desplegadas
        run: npx playwright test e2e/api.spec.ts --project=escritorio-light

      # SEO (fase 6): canónicas y datos estructurados de las rutas dinámicas.
      # Está aquí y no en ci.yml porque su modo de fallo es SILENCIOSO: si
      # alguien borra una canónica o un bloque JSON-LD, la página sigue
      # devolviendo 200 y el build, el tsc, el eslint y los 508 vitest siguen
      # verdes — ningún test de unidad importa una page.tsx. Sin este paso, la
      # única red era el megatest, que solo se ejecuta a mano en el portátil.
      # Cabe aquí sin coste: 12 de sus 13 pruebas son peticiones HTTP sin
      # navegador, y el chromium que necesita la restante ya está instalado.
      - name: Comprobar canónicas y datos estructurados en producción
        run: npx playwright test e2e/seo.spec.ts --project=escritorio-light

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 7

      # AVISO AL DUEÑO. Añadido el 1-ago-2026 despues de que un cambio en la
      # configuracion del pool tumbara produccion: este smoke SI lo detecto (run
      # en rojo sobre el commit 2b1afbd) pero no habia nada que avisara, asi que
      # de no haber estado alguien mirando GitHub en ese momento, la web se
      # habria quedado caida con un ✗ que nadie lee.
      #
      # Un Issue nuevo hace que GitHub mande el email; comentar en uno abierto,
      # no. Por eso se busca por TITULO y no por etiqueta: un Issue viejo sin
      # cerrar solo debe silenciar su propio hilo, nunca el canal entero (esa
      # fue exactamente la averia del Issue 16 en mma-ingesta).
      - name: Avisar si produccion esta rota
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          TITULO="🔴 Produccion rota — el smoke ha fallado"
          BODY=$(printf '⛔ **%s** — el smoke contra produccion ha fallado sobre el commit `%s`.\n\n[Ver el run](%s)\n\nQue comprobar primero:\n- `curl -s https://mmastatus.app/api/health` — si dice `db: down`, es la conexion a Neon (variable de entorno o endpoint pooler).\n- Que la version que sirve `/api/health` sea la esperada.\n\n_Cierra este Issue al arreglarlo: mientras siga abierto, los siguientes fallos seran comentarios y no te llegara un email nuevo._' \
            "$(date -u +'%Y-%m-%d %H:%M UTC')" "${SHA:0:7}" "$RUN_URL")
          ISSUE=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
            | jq -r --arg t "$TITULO" '[.[] | select(.title == $t)] | .[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY"
          else
            gh label create produccion-rota --repo "$REPO" --color B60205 --description "El smoke contra produccion ha fallado" --force || true
            gh issue create --repo "$REPO" --title "$TITULO" --label produccion-rota --body "$BODY"
          fi
