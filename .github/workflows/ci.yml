name: CI

# Lint + type-check + unit tests on every push / PR to main. No secrets: the
# vitest suite is fully unit-tested (mocks Anthropic, never touches Neon).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      # Un import roto en un Server Component o un fallo de generación de
      # metadata NO lo ve ninguno de los pasos anteriores: pasan en verde y el
      # fallo aparece en el deploy de Vercel. Corre sin secretos a propósito:
      # todas las rutas con datos son dinámicas (server-rendered on demand), así
      # que el build no consulta Neon, y sitemap.ts degrada a las rutas
      # estáticas por su try/catch cuando la BD no responde.
      - run: npm run build
